<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script>try{var l=localStorage.getItem('adams-survey-lang');if(l!=='en'&&l!=='es')l=/^es/i.test(navigator.language||'')?'es':'en';document.documentElement.lang=l}catch(e){}</script>
<style>
  :root{--green:#193B0A;--cream:#EEEEDE;--yellow:#FBE661;--olive:#5d6244;--ink:#20241a;
    --line:#d8d8c8;--white:#fbfbf5;--bad:#a5362b;--good:#2f6a2f;--muted:#5f6350}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--cream)}
  [hidden]{display:none !important}
  html[lang="en"] [data-l="es"],html[lang="es"] [data-l="en"]{display:none !important}
  header{background:var(--green);color:var(--cream);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header .dot{width:20px;height:20px;border-radius:50%;background:var(--yellow);flex:none}
  header .t{flex:1 1 200px;min-width:0}
  header h1{font-size:16px;margin:0}
  header small{display:block;opacity:.85;font-size:11.5px}
  .langsw{display:inline-flex;border:1px solid rgba(238,238,222,.6);border-radius:8px;overflow:hidden;flex:none}
  .langsw button{background:transparent;color:var(--cream);border:0;border-radius:0;padding:0 14px;min-height:44px;min-width:50px;
    font-weight:700;font-size:14px;letter-spacing:.05em}
  .langsw button[aria-pressed="true"]{background:var(--yellow);color:var(--green)}
  main{max-width:1180px;margin:0 auto;padding:14px}
  .card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--olive);margin:0 0 8px}
  h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--olive);margin:14px 0 6px}
  h3.first{margin-top:0}
  h3 .note{text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted)}
  button{cursor:pointer;font:inherit;border:0;border-radius:8px;padding:8px 14px;background:var(--green);
    color:var(--cream);font-weight:600;min-height:44px}
  button.ghost{background:transparent;color:var(--green);border:1px solid var(--green)}
  button.ghost.danger{color:var(--bad);border-color:var(--bad)}
  button.small{min-height:36px;padding:4px 12px;font-size:13px}
  button:disabled{opacity:.5;cursor:default}
  input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--white);
    width:100%;min-height:44px}
  a{color:#1d5a9e}
  a.btnlink{display:inline-flex;align-items:center;min-height:36px;padding:4px 12px;border:1px solid var(--green);border-radius:8px;
    color:var(--green);font-weight:600;font-size:13px;text-decoration:none}
  .login{max-width:380px;margin:40px auto}
  .login form{display:flex;flex-direction:column;gap:10px}
  .login p{margin:10px 0 0;font-size:13px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .bar .grow{flex:1 1 200px;color:var(--muted);font-size:13px}
  .bar .find{flex:1 1 220px;max-width:340px}
  #msg{font-size:13.5px;margin:0 0 10px;min-height:1em}
  #msg.bad{color:var(--bad)}
  .muted{color:var(--muted)}
  .flag{display:inline-block;font-size:11px;font-weight:700;color:#8a4a1a;background:#f2ddd0;border-radius:10px;padding:0 7px;margin-left:6px}
  .ok{color:var(--good);font-weight:600}

  .tbl{width:100%;border-collapse:collapse;background:var(--white);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--olive);
    padding:8px 10px;border-bottom:1px solid var(--line);background:var(--cream)}
  .tbl td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top;overflow-wrap:anywhere}
  .tbl td.acts{white-space:nowrap}
  .tbl td.acts button{margin-right:6px}
  tr.detail td{background:#f4f4e8}
  .detail-body{padding:4px 2px}
  .cols{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
  .cols > div{flex:1 1 300px;min-width:0}
  .kv{display:flex;gap:8px;padding:2px 0;font-size:13.5px}
  .kv .k{flex:0 0 160px;color:var(--muted)}
  .kv .v{flex:1;min-width:0;overflow-wrap:anywhere}
  .sec{margin-bottom:10px}
  .entry{border-left:3px solid var(--line);padding-left:10px;margin:6px 0}
  .entry-n{font-size:11px;color:var(--olive);font-weight:700}
  .bsvg{width:260px;max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:var(--white);margin-top:6px}
  .locator{position:relative;width:140px;height:140px;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:8px;background:var(--cream)}
  .locator img{width:100%;height:100%;object-fit:cover;display:block}
  .locator-dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#E8730C;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
  .locator-note{margin-top:4px}
  .notes{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px}
  .photos{display:flex;gap:8px;flex-wrap:wrap}
  .photos img{width:130px;height:130px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
  .photos img.big{width:min(100%,640px);height:auto;object-fit:contain;cursor:zoom-out}
  .sug{border:1px solid #cfd9b4;background:#f3f7e6;border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13.5px}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}

  @media (max-width:1000px){
    .tbl thead{display:none}
    .tbl, .tbl tbody, .tbl tr, .tbl td{display:block;width:100%}
    .tbl tr.row{border-bottom:1px solid var(--line);padding:6px 0}
    .tbl td{border:0;padding:3px 10px;display:flex;gap:8px}
    .tbl td::before{content:attr(data-label);flex:0 0 110px;color:var(--muted);font-size:11px;
      text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
    .tbl td:empty{display:none}
    .tbl td.acts{padding:8px 10px;flex-wrap:wrap}
    .tbl td.acts::before{content:none}
    tr.detail td{display:block}
    tr.detail td::before{content:none}
    .kv .k{flex-basis:120px}
  }
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <div class="t">
    <h1>Adams Grain Company</h1>
    <small><span data-l="en">Grower survey submissions</span><span data-l="es">Encuestas de productores recibidas</span></small>
  </div>
  <div class="langsw" role="group" aria-label="Language / Idioma">
    <button type="button" class="lang-btn" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" class="lang-btn" data-lang="es" aria-pressed="false">ES</button>
  </div>
</header>
<main>
  <section id="login" class="card login" hidden>
    <h2><span data-l="en">Sign in</span><span data-l="es">Ingresar</span></h2>
    <form id="loginForm" autocomplete="on">
      <input id="pw" type="password" data-ph-en="Admin password" data-ph-es="Contraseña de administrador" placeholder="Admin password" autocomplete="current-password" required>
      <button type="submit" id="loginBtn"><span data-l="en">Sign in</span><span data-l="es">Ingresar</span></button>
    </form>
    <p id="loginMsg" class="muted"></p>
  </section>

  <section id="app" hidden>
    <div class="bar">
      <span class="grow" id="count"></span>
      <input class="find" id="find" type="search" data-ph-en="Search farm, field, contact, buyer, country" data-ph-es="Buscar finca, campo, contacto, comprador, país" placeholder="Search farm, field, contact, buyer, country" aria-label="Search">
      <button class="ghost" id="csv" type="button"><span data-l="en">Export list (CSV)</span><span data-l="es">Exportar lista (CSV)</span></button>
      <button class="ghost" id="refresh" type="button"><span data-l="en">Refresh</span><span data-l="es">Actualizar</span></button>
      <button class="ghost" id="signout" type="button"><span data-l="en">Sign out</span><span data-l="es">Cerrar sesión</span></button>
    </div>
    <p id="msg" role="status"></p>
    <div id="list"></div>
    <div class="bar"><button class="ghost" id="more" type="button" hidden><span data-l="en">Load older submissions</span><span data-l="es">Cargar envíos anteriores</span></button></div>
  </section>
</main>

  const xf = (lon + 180) / 360 * n;
  const latRad = lat * Math.PI / 180;
  const yf = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n;
  const x = Math.max(0, Math.min(n - 1, Math.floor(xf))), y = Math.max(0, Math.min(n - 1, Math.floor(yf)));
  return {x, y, px: (xf - x) * 256, py: (yf - y) * 256};
}
function locatorHtml(lat, lon) {
  if (!isFinite(lat) || !isFinite(lon)) return '';
  const t = locatorTile(lon, lat, LOCATOR_ZOOM);
  // No inline style= here (admin's CSP has no 'unsafe-inline' for style-src) - the dot's position is
  // set via data-px/data-py and placed by positionLocatorDots() after insertion, which uses the CSSOM
  // (el.style.left = ...) rather than an HTML style attribute; CSP's style-src does not restrict that.
  return `<div class="locator" aria-hidden="true">
    <img src="https://tile.openstreetmap.org/${LOCATOR_ZOOM}/${t.x}/${t.y}.png" alt="" loading="lazy" width="256" height="256">
    <span class="locator-dot" data-px="${t.px.toFixed(1)}" data-py="${t.py.toFixed(1)}"></span>
  </div>
  <p class="hint locator-note">${esc(T('Approximate location, from public OpenStreetMap tiles.', 'Ubicación aproximada, según mapas públicos de OpenStreetMap.'))}</p>`;
}
function photosHtml(photos) {
  const ok = validPhotos(photos);
  if (!ok.length) return '';
  return `<h3>${esc(T('Photos', 'Fotos'))} (${ok.length}) <span class="note">${esc(T('click a photo to enlarge', 'toque una foto para agrandarla'))}</span></h3>
    <div class="photos">${ok.map(p => `<img src="${esc(p.dataUri)}" alt="${esc(clip(p.filename || 'photo', 80))}" loading="lazy">`).join('')}</div>`;
}
function suggestionsHtml(a) {
  if (!a || typeof a !== 'object') return '';
  const acc = a.accepted && typeof a.accepted === 'object' ? a.accepted : {};
  const accLu = Array.isArray(acc.landuse) ? acc.landuse : [];
  const conf = c => esc(T(c + ' confidence', ({high: 'confianza alta', medium: 'confianza media', low: 'confianza baja'})[c] || c));
  let out = `<h3>${esc(T('What the survey suggested', 'Lo que sugirió la encuesta'))} <span class="note">${esc(T('public-data estimates the grower could accept or ignore', 'estimaciones de datos públicos que el productor podía aceptar o ignorar'))}</span></h3>`;
  if (a.soil) out += `<div class="sug"><b>${esc(T('Soil', 'Suelo'))}</b> (${esc(a.soil.source)}, ${conf(a.soil.confidence)}): ${esc(clip(a.soil.value, 200))}<br>${acc.soil ? `<span class="ok">${esc(T('Accepted by the grower', 'Aceptado por el productor'))}</span>` : esc(T('Not accepted', 'No aceptado'))}</div>`;
  const lu = a.landuse;
  if (lu) {
    const sugs = Array.isArray(lu.suggestions) ? lu.suggestions : [];
    out += `<div class="sug"><b>${esc(T('Land use', 'Uso del suelo'))}</b> (${esc(lu.source)}); ${esc(T('current state', 'estado actual'))}: ${esc(lu.currentState || T('unknown', 'desconocido'))}`;
    out += sugs.length ? '<br>' + sugs.map(s => {
      const key = `${s.yearChange}:${s.landFrom}>${s.landTo}`;
      return `${esc(s.yearChange)}: ${esc(s.landFrom)} ${esc(T('to', 'a'))} ${esc(s.landTo)} (${conf(s.confidence)}) ${accLu.includes(key) ? `<span class="ok">${esc(T('accepted', 'aceptado'))}</span>` : esc(T('not accepted', 'no aceptado'))}`;
    }).join('<br>') : `<br>${esc(T('No change detected', 'No se detectó ningún cambio'))}`;
    out += '</div>';
  }
  const nd = a.ndvi;
  if (nd) {
    out += `<div class="sug"><b>${esc(T('Satellite greenness (NDVI)', 'Verdor satelital (NDVI)'))}</b> (${esc(nd.start)} – ${esc(nd.end)}, ${esc(String(nd.scenesSearched ?? '?'))} ${esc(T('scenes searched', 'escenas buscadas'))})`;
    const seasons = Array.isArray(nd.seasons) ? nd.seasons : [];
    out += seasons.length ? '<br>' + seasons.map((s, i) =>
      `${esc(T(`Season ${i + 1}`, `Temporada ${i + 1}`))}: ${esc(s.sos || '?')} → ${esc(s.peak_date || '?')} → ${esc(s.eos || '?')} (${conf(s.confidence)})`
    ).join('<br>') : `<br>${esc(T('No season detected in this window.', 'No se detectó ninguna temporada en esta ventana.'))}`;
    out += '</div>';
  }
  const df = a.deforestation;
  if (df) {
    const FLAG_LABEL = {
      not_forest_2020: ['Not forested at cutoff', 'Sin bosque en la fecha de referencia'],
      still_forested: ['Forested at cutoff, still forested', 'Con bosque en la fecha de referencia, sigue con bosque'],
      possible_deforestation: ['POSSIBLE DEFORESTATION SINCE CUTOFF', 'POSIBLE DEFORESTACIÓN DESDE LA FECHA DE REFERENCIA'],
      unknown: ['Forested at cutoff, current status unknown', 'Con bosque en la fecha de referencia, estado actual desconocido'],
    }[df.flag] || [df.flag, df.flag];
    const share = df.shareOfField != null ? ` (~${Math.round(df.shareOfField * 100)}% ${esc(T('of field', 'del lote'))}, ${esc(String(df.samples))} ${esc(T('samples', 'muestras'))})` : '';
    out += `<div class="sug"><b>${esc(T('Deforestation-free check', 'Verificación de libre de deforestación'))}</b> (${esc(df.source)}, ${esc(T('reference date', 'fecha de referencia'))} ${esc(String(df.cutoffYear))}-12-31): ` +
      `${esc(T(FLAG_LABEL[0], FLAG_LABEL[1]))}${df.flag === 'possible_deforestation' ? `<span class="flag">${esc(T('REVIEW', 'REVISAR'))}</span>` : ''}${share}</div>`;
  }
  if (!a.soil && !lu && !nd && !df) out += `<p class="muted">${esc(T('No suggestions were available for this location.', 'No había sugerencias disponibles para este lugar.'))}</p>`;
  return out;
}
function kml(name, pts) {
  const x = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const ring = pts.length && (pts[0][0] !== pts[pts.length - 1][0] || pts[0][1] !== pts[pts.length - 1][1]) ? [...pts, pts[0]] : pts;
  return `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><Placemark><name>${x(name)}</name><Polygon><outerBoundaryIs><LinearRing><coordinates>` +
    ring.map(p => p.join(',')).join(' ') + `</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark></Document></kml>`;
}
function renderDetail(sub) {
  const b = sub && sub.bundle && typeof sub.bundle === 'object' ? sub.bundle : {};
  const id = Number(sub.id);
  const phone = String(b.phone || '');
  const tel = phone.replace(/[^\d+]/g, '');
  const con = b.consent && typeof b.consent === 'object' ? b.consent : null;
  let info = '';
  const add = (k, v) => { if (v) info += kv(k, v); };
  add(T('Grower / farm', 'Productor / finca'), esc(clip(b.farmName, 200)));
  add(T('Field / plot', 'Campo / parcela'), esc(clip(b.fieldName, 200)));
  add(T('Contact', 'Contacto'), esc(clip(b.contactName, 200)));
  add(T('Phone', 'Teléfono'), tel.length >= 5 ? `<a href="tel:${esc(tel)}">${esc(clip(phone, 60))}</a>` : esc(clip(phone, 60)));
  add(T('Email', 'Correo electrónico'), validEmail(b.email) ? `<a href="mailto:${esc(b.email)}">${esc(b.email)}</a>` : esc(clip(b.email, 200)));
  add(T('Buyer / exporter', 'Comprador / exportador'), esc(clip(b.buyer, 200)));
  add(T('Filled out by', 'Completado por'), esc(clip(b.filledBy, 200)));
  add(T('Survey language', 'Idioma de la encuesta'), b.lang === 'es' ? esc(T('Spanish', 'Español')) : (b.lang === 'en' ? esc(T('English', 'Inglés')) : ''));
  add(T('Consent', 'Consentimiento'), con && con.agreed
    ? `<span class="ok">${esc(T('Agreed', 'Aceptó'))}</span> (${esc(clip(con.version, 40))}${con.at ? ', ' + esc(fmtTime(con.at)) : ''})`
    : (b.version === 1 ? `<span class="muted">${esc(T('Earlier survey version, no consent box', 'Versión anterior de la encuesta, sin casilla de consentimiento'))}</span>` : `<span class="flag">${esc(T('not recorded', 'sin registro'))}</span>`));
  add(T('Submitted', 'Enviado'), esc(fmtTime(sub.submitted_at)));
  add(T('Reference', 'Referencia'), '#' + id + (b.clientId ? ` <span class="muted">(${esc(clip(b.clientId, 8))})</span>` : ''));
  const bd = b.boundary && typeof b.boundary === 'object' ? b.boundary : null;
  const pts = bd ? cleanRing(bd.ring) : [];
  let bdHtml = `<p class="muted">${esc(T('No boundary.', 'Sin límite.'))}</p>`;
  if (bd) {
    const [clat, clon] = pts.length ? centroid(pts) : [null, null];
    const acres = Number(bd.acres);
    bdHtml = kv(T('Capture method', 'Método de captura'), esc(bd.method === 'walk' ? T('GPS walk', 'Recorrido con GPS') : T('Drawn on map', 'Dibujado en el mapa'))) +
      kv(T('Area', 'Superficie'), Number.isFinite(acres) ? `${esc(acres)} acres (${(acres * 0.404686).toFixed(1)} ha)` : esc(T('unknown', 'desconocida'))) +
      kv(T('Corner points', 'Puntos de esquina'), String(Math.max(0, pts.length - 1))) +
      (clat != null ? kv(T('Center', 'Centro'), `${clat.toFixed(5)}, ${clon.toFixed(5)}`) : '') +
      (clat != null ? `<div class="btnrow"><a class="btnlink" href="https://www.google.com/maps?q=${clat.toFixed(6)},${clon.toFixed(6)}&amp;t=k" target="_blank" rel="noopener noreferrer">${esc(T('Open in Google Maps', 'Abrir en Google Maps'))}</a>` +
        `<button class="ghost small" type="button" data-act="kml" data-sub="${id}">${esc(T('Download KML', 'Descargar KML'))}</button></div>` : '') +
      boundarySvg(pts) + (clat != null ? locatorHtml(clat, clon) : '');
  }
  const attachHtml = (list, title, titleEs, src) => {
    const items = Array.isArray(list) ? list : [];
    if (!items.length) return '';
    return `<h3>${esc(T(title, titleEs))}</h3>${items.map((f, i) =>
      `<div class="kv"><span class="v">${esc(clip(f && f.filename, 120))}</span>
       <button class="ghost small" type="button" data-act="extra" data-src="${src}" data-sub="${id}" data-idx="${i}">${esc(T('Download', 'Descargar'))}</button></div>`).join('')}`;
  };
  const extraHtml = attachHtml(b.additionalBoundaries, 'Additional field files', 'Archivos de otros campos', 'additionalBoundaries');
  const soilLabHtml = attachHtml(b.soilLabFiles, 'Soil sample results', 'Resultados de análisis de suelo', 'soilLabFiles');
  return `<div class="cols">
    <div><h3 class="first">${esc(T('Survey info', 'Datos de la encuesta'))}</h3>${info}
      ${b.notes ? `<h3>${esc(T('Notes', 'Notas'))}</h3><div class="notes">${esc(clip(b.notes, 5000))}</div>` : ''}
      <h3>${esc(T('Field boundary', 'Límite del campo'))}</h3>${bdHtml}${extraHtml}${soilLabHtml}
      ${suggestionsHtml(b.autoSuggestions)}</div>
    <div><h3 class="first">${esc(T('Answers', 'Respuestas'))}</h3>${answersHtml(b.answers, b.noneApplied)}</div>
  </div>${photosHtml(b.photos)}`;
}

// ---- actions ------------------------------------------------------------------------------------
// Positions locator dots via the CSSOM (not an HTML style= attribute - see locatorHtml()'s comment).
function positionLocatorDots(root) {
  root.querySelectorAll('.locator-dot[data-px]').forEach(d => { d.style.left = d.dataset.px + 'px'; d.style.top = d.dataset.py + 'px'; });
}
function fillDetail(id) {
  const row = document.getElementById('detail-' + id);
  if (row && loaded.has(id)) {
    const body = row.querySelector('.detail-body');
    body.innerHTML = renderDetail(loaded.get(id));
    positionLocatorDots(body);
  }
}
async function toggleDetail(id, btn) {
  const row = document.getElementById('detail-' + id);
  if (!row) return;
  if (!row.hidden) { row.hidden = true; openIds.delete(id); btn.textContent = T('View', 'Ver'); return; }
  row.hidden = false; openIds.add(id); btn.textContent = T('Hide', 'Ocultar');
  const body = row.querySelector('.detail-body');
  try { await getSub(id); fillDetail(id); }
  catch (err) {
    handleAuth(err); openIds.delete(id);
    const f = friendly(err);
    body.textContent = T('Could not load this submission. ', 'No se pudo cargar este envío. ') + T(f.en, f.es);
  }
}
function failMsg(err) {
  handleAuth(err);
  const f = friendly(err);
  setMsg('Could not download. ' + f.en, 'No se pudo descargar. ' + f.es, true);
}
async function downloadJson(id) {
  try {
    const sub = await getSub(id);
    const out = {...sub.bundle, photos: validPhotos(sub.bundle && sub.bundle.photos)};
    download(`adams-grower-survey_${safeName(sub.farm_name)}_${id}.json`, JSON.stringify(out, null, 2), 'application/json');
  } catch (err) { failMsg(err); }
}
function dataUriToBlob(dataUri) {
  const m = /^data:([^;]+);base64,(.*)$/.exec(dataUri || '');
  if (!m) return null;
  const bin = atob(m[2]);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], {type: m[1]});
}
async function downloadExtra(id, idx, src) {
  try {
    const sub = await getSub(id);
    const f = (sub.bundle[src || 'additionalBoundaries'] || [])[idx];
    if (!f) return;
    let name = String(f.filename || 'boundary').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.\- ]/g, '_').slice(0, 80);
    // Text formats (KML/GeoJSON/GPX) are stored as plain text; photos and shapefile bundles are stored
    // as a data URI (binary), same as the field's own photos - decode that back into its real bytes.
    if (f.dataUri) {
      const blob = dataUriToBlob(f.dataUri);
      if (!blob) return;
      if (!/\.[a-z0-9]+$/i.test(name)) {
        const ext = {'image/jpeg': '.jpg', 'image/png': '.png', 'application/zip': '.zip', 'application/pdf': '.pdf',
          'application/vnd.ms-excel': '.xls', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': '.xlsx'}[blob.type] || '';
        name += ext;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      return;
    }
    if (!/\.(kml|geojson|json|gpx|csv)$/i.test(name)) name += '.txt';
    download(name, String(f.text || ''), 'text/plain');
  } catch (err) { failMsg(err); }
}
async function downloadKml(id) {
  try {
    const sub = await getSub(id);
    const pts = cleanRing(sub.bundle && sub.bundle.boundary && sub.bundle.boundary.ring);
    if (pts.length < 3) return;
    download(`adams-grower-survey_${safeName(sub.farm_name)}_${id}.kml`, kml(sub.farm_name || 'Field boundary', pts), 'application/vnd.google-earth.kml+xml');
  } catch (err) { failMsg(err); }
}
// Delete is irreversible - a native confirm() dialog forces a deliberate second action (and cannot be
// dismissed by a stray extra click the way a custom modal button could), naming the farm so a grower
// is never deleted by id number alone. On success the row is spliced out of every in-memory list and
// list, and the detail row is closed - a stale open panel could reference an id that no longer exists.
async function deleteSub(id, btn) {
  const row = allRows.find(r => Number(r.id) === id);
  const label = row ? `#${id} (${row.farm_name || ''})` : `#${id}`;
  const ok = confirm(T(
    `Delete submission ${label}? This permanently removes it from the database and cannot be undone.`,
    `¿Eliminar el envío ${label}? Esto lo borra de la base de datos de forma permanente y no se puede deshacer.`));
  if (!ok) return;
  if (btn) btn.disabled = true;
  try {
    const r = await fetch('/api/submissions?id=' + encodeURIComponent(id), {method: 'DELETE', headers: {Authorization: 'Bearer ' + pw}});
    let j = null; try { j = await r.json(); } catch {}
    if (!r.ok || !j || !j.ok) { const e = new Error((j && j.error) || ('HTTP ' + r.status)); e.code = r.status; throw e; }
    allRows = allRows.filter(x => Number(x.id) !== id);
    loaded.delete(id); openIds.delete(id);
    total = Math.max(0, total - 1);
    renderList();
    setMsg(T(`Deleted submission #${id}.`, `Se eliminó el envío #${id}.`));
  } catch (err) {
    handleAuth(err);
    const f = friendly(err);
    setMsg('Could not delete. ' + f.en, 'No se pudo eliminar. ' + f.es, true);
  } finally { if (btn) btn.disabled = false; }
}
// Spreadsheet formula injection: farm names etc. come from a public form, so a value starting with = + - @
// would run as a formula when the CSV is opened in Excel or Sheets. A leading apostrophe defuses it.
// (Column names stay in English in both languages: the CSV is data, and other tools read it.)
const csvCell = v => { let s = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
function exportCsv() {
  const rows = visibleRows();
  if (!rows.length) { setMsg('Nothing to export yet.', 'Todavía no hay nada que exportar.', true); return; }
  const head = ['id', 'submitted_pacific', 'farm', 'field', 'contact', 'phone', 'buyer', 'country', 'crop', 'acres', 'photos', 'extra_fields', 'survey_language', 'deforestation_flag'];
  const lines = [head.join(',')].concat(rows.map(r => [r.id, fmtTime(r.submitted_at), r.farm_name, r.field_name, r.contact_name, r.phone, r.buyer, r.country, r.crop, r.acres, r.photo_count, r.extra_fields, r.lang, r.deforest_flag || ''].map(csvCell).join(',')));
  download(`adams-grower-surveys_${new Date().toISOString().slice(0, 10)}.csv`, '﻿' + lines.join('\r\n'), 'text/csv');
  setMsg(`Exported ${rows.length} row${rows.length === 1 ? '' : 's'}.`, `Se exportaron ${rows.length} fila${rows.length === 1 ? '' : 's'}.`);
}
document.addEventListener('click', e => {
  const img = e.target.closest('.photos img');
  if (img) { img.classList.toggle('big'); return; }
  const btn = e.target.closest('button[data-act]');
  if (!btn || busy) return;
  const act = btn.dataset.act;
  if (act === 'extra') { downloadExtra(Number(btn.dataset.sub), Number(btn.dataset.idx), btn.dataset.src); return; }
  if (act === 'kml') { downloadKml(Number(btn.dataset.sub)); return; }
  const tr = btn.closest('tr.row');
  if (!tr) return;
  const id = Number(tr.dataset.id);
  if (act === 'view') toggleDetail(id, btn);
  else if (act === 'json') downloadJson(id);
  else if (act === 'delete') deleteSub(id, btn);
});

// ---- language -------------------------------------------------------------------------------------
function applyLang() {
  document.documentElement.lang = LANG;
  $$('.lang-btn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
  $$('[data-ph-en]').forEach(el => { el.placeholder = (LANG === 'es' && el.dataset.phEs) ? el.dataset.phEs : el.dataset.phEn; });
  document.title = T('Adams Survey Submissions', 'Envíos de la encuesta Adams');
  paintMsg(); paintLogin();
  if (!$('#app').hidden) renderList();
}
$$('.lang-btn').forEach(b => b.onclick = () => {
  LANG = b.dataset.lang === 'es' ? 'es' : 'en';
  try { localStorage.setItem(LANG_KEY, LANG); } catch {}
  applyLang();
});

// ---- session ------------------------------------------------------------------------------------
function showLogin(en, es) {
  $('#app').hidden = true; $('#login').hidden = false;
  loginState = en ? {en, es} : null; paintLogin();
  $('#pw').focus();
}
function handleAuth(err) {
  if (err && err.code === 401) { pw = ''; try { sessionStorage.removeItem(KEY); } catch {} showLogin('Wrong password.', 'Contraseña incorrecta.'); }
}
async function load(explicit) {
  if (busy) return;
  setBusy(true); setMsg('Loading…', 'Cargando…');
  try {
    const j = await api('');
    try { sessionStorage.setItem(KEY, pw); } catch {}
    loaded.clear(); openIds.clear();
    allRows = Array.isArray(j.submissions) ? j.submissions : [];
    total = Number(j.total) || allRows.length; hasMore = !!j.hasMore;
    $('#login').hidden = true; $('#app').hidden = false;
    renderList(); setMsg('');
  } catch (err) {
    if (err.code === 401) {
      pw = ''; try { sessionStorage.removeItem(KEY); } catch {}
      if (explicit) showLogin('Wrong password.', 'Contraseña incorrecta.'); else showLogin('');
    } else {
      $('#login').hidden = true; $('#app').hidden = false;
      const f = friendly(err);
      setMsg('Could not load submissions. ' + f.en, 'No se pudieron cargar los envíos. ' + f.es, true);
    }
  } finally { setBusy(false); }
}
async function loadMore() {
  if (busy || !allRows.length) return;
  setBusy(true); setMsg('Loading older submissions…', 'Cargando envíos anteriores…');
  try {
    const j = await api('?before=' + encodeURIComponent(allRows[allRows.length - 1].id));
    allRows = allRows.concat(Array.isArray(j.submissions) ? j.submissions : []);
    total = Number(j.total) || total; hasMore = !!j.hasMore;
    renderList(); setMsg('');
  } catch (err) {
    handleAuth(err);
    const f = friendly(err);
    setMsg('Could not load more. ' + f.en, 'No se pudo cargar más. ' + f.es, true);
  } finally { setBusy(false); }
}
$('#loginForm').addEventListener('submit', e => {
  e.preventDefault();
  pw = $('#pw').value.trim();
  $('#pw').value = '';
  if (pw) load(true);
});
$('#refresh').onclick = () => load(false);
$('#more').onclick = loadMore;
$('#csv').onclick = exportCsv;
$('#find').addEventListener('input', renderList);
$('#signout').onclick = () => { pw = ''; try { sessionStorage.removeItem(KEY); } catch {} allRows = []; loaded.clear(); openIds.clear(); showLogin(''); };

applyLang();
if (!/^https?:$/.test(location.protocol)) {
  // Opened from a local file or an editor preview: there is no server behind /api/ here.
  showLogin('This page only works at its live address: https://adams-grower-survey.vercel.app/admin/', 'Esta página solo funciona en su dirección en línea: https://adams-grower-survey.vercel.app/admin/');
  $('#loginBtn').disabled = true;
} else if (pw) load(false); else showLogin('');
</script>
